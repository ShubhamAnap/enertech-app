<!doctype html>
<html lang="en" data-theme="enertech">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="EnerTech customer platform admin prototype" />
    <title>EnerTech Admin · Platform overview</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="drawer lg:drawer-open min-h-screen">
      <input id="admin-drawer" type="checkbox" class="drawer-toggle" />
      <div class="drawer-content min-h-screen">
        <header class="navbar topbar px-4 md:px-8">
          <div class="flex-none lg:hidden">
            <label for="admin-drawer" class="btn btn-square btn-ghost" aria-label="Open navigation">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            </label>
          </div>
          <div class="flex-1">
            <div class="breadcrumbs text-sm"><ul><li>Workspace</li><li id="crumb">Dashboard</li></ul></div>
          </div>
          <div class="flex-none gap-2">
            <label class="input input-bordered searchbox hidden sm:flex">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.5 4.5"/></svg>
              <input type="search" placeholder="Search this workspace" aria-label="Search this workspace" disabled />
              <kbd class="kbd kbd-sm">⌘ K</kbd>
            </label>
            <button class="btn btn-ghost btn-square" aria-label="Notifications" title="Notifications are not connected">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            </button>
            <div class="avatar placeholder"><div class="avatar-circle">ET</div></div>
          </div>
        </header>

        <main class="content-wrap px-4 py-7 md:px-8 md:py-9">
          <div class="prototype-note alert" role="status">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg>
            <span><strong>Prototype workspace</strong> · No live data, customer records, or publishing actions are connected.</span>
          </div>
          <div id="page-content" aria-live="polite"></div>
        </main>
      </div>

      <aside class="drawer-side z-20">
        <label for="admin-drawer" aria-label="Close navigation" class="drawer-overlay"></label>
        <div class="sidebar min-h-full w-72 flex flex-col">
          <a class="brand-lockup" href="#dashboard" aria-label="EnerTech platform home">
            <span class="brand-mark">E</span><span><strong>EnerTech</strong><small>Customer Platform</small></span>
          </a>
          <div class="workspace-label">WORKSPACE</div>
          <ul class="menu nav-menu px-3" id="navigation" aria-label="Main navigation"></ul>
          <div class="sidebar-bottom">
            <div class="environment-pill"><span></span> Local prototype</div>
            <div class="user-row"><div class="avatar placeholder"><div class="avatar-circle user-avatar">AD</div></div><div><strong>Workspace preview</strong><small>Authentication not connected</small></div><span class="user-more">···</span></div>
          </div>
        </div>
      </aside>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
