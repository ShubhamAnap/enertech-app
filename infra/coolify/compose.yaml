services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_NAME: EnerTech Customer Platform API
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?set Supabase session-pooler URL with sslmode=require}
      SUPABASE_URL: ${SUPABASE_URL:?set Supabase project URL for CMS asset uploads}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set server-only Supabase service role key}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:?set the public CMS origin}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set Firebase project ID}
      # Runtime-only secret: do not require or pass it to the image build.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:?set Firebase Admin service-account JSON}
      BOOTSTRAP_SUPER_ADMIN_UIDS: ${BOOTSTRAP_SUPER_ADMIN_UIDS:-}
      WORDPRESS_API_BASE_URL: ${WORDPRESS_API_BASE_URL:-}
      WORDPRESS_CONSUMER_KEY: ${WORDPRESS_CONSUMER_KEY:-}
      WORDPRESS_CONSUMER_SECRET: ${WORDPRESS_CONSUMER_SECRET:-}
      CHAT_ALLOWED_HOSTS: ${CHAT_ALLOWED_HOSTS:-}
      CHAT_WIDGET_SCRIPT_URL: ${CHAT_WIDGET_SCRIPT_URL:-}
      CHAT_WIDGET_PUBLIC_KEY: ${CHAT_WIDGET_PUBLIC_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set the public API URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?set Firebase web API key}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?set Firebase auth domain}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set Firebase project ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?set Firebase web app ID}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?set Firebase sender ID}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
